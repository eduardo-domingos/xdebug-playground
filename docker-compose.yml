services:

  php56:
    build:
      context: ./docker/php56
      dockerfile: Dockerfile
    container_name: php56
    volumes:
      - ./src:/var/www/html

  php74:
    build:
      context: ./docker/php74
      dockerfile: Dockerfile
    container_name: php74
    volumes:
      - ./src:/var/www/html

  php85:
    build:
      context: ./docker/php85
      dockerfile: Dockerfile
    container_name: php85
    volumes:
      - ./src:/var/www/html

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: nginx

    ports:
      - "8056:8056"
      - "8074:8074"
      - "8085:8085"

    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php56
      - php74
      - php85
